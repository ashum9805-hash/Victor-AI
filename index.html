<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Suppress Vite HMR WebSocket connection errors in AI Studio where HMR is disabled
      window.addEventListener('error', function(e) {
        var msg = e && (e.message || (e.error && e.error.message) || '');
        var file = (e && e.filename) || '';
        if (
          (msg && (msg.indexOf('WebSocket') !== -1 || msg.indexOf('closed without opened') !== -1)) ||
          (file && file.indexOf('@vite/client') !== -1)
        ) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        var reason = e.reason ? (e.reason.message || String(e.reason)) : '';
        if (reason && (reason.indexOf('WebSocket') !== -1 || reason.indexOf('closed without opened') !== -1)) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      });
    </script>
    <title>Victor</title>
    <meta name="description" content="Victor – an intelligent personal AI assistant powered by Gemini." />
    <meta property="og:title" content="Victor" />
    <meta property="og:description" content="Victor – an intelligent personal AI assistant powered by Gemini." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#09090b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Victor" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" crossorigin="anonymous" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
